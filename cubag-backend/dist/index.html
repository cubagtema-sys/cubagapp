<!DOCTYPE html>
<html>
<head>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }
  </script>
  <!--

    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of

  <style>

      font-family: 'Inter', 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      margin: 0;
      padding: 0;
    }
    @media (prefers-color-scheme: dark) {
      html, body {
        background-color: #0f172a;
      }
    }
  </style>
</head>
<body>
  <!-- Flutter Web Bootstrap Loader -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    function loadFlutterFallback() {
      console.warn('flutter_bootstrap.js not found or failed, initializing Flutter fallback loader...');
      var script = document.createElement('script');
      script.src = 'flutter.js';
      script.onload = function() {
        if (window._flutter && window._flutter.loader) {
          if (typeof window._flutter.loader.load === 'function') {
            window._flutter.loader.load();
          } else if (typeof window._flutter.loader.loadEntrypoint === 'function') {
            window._flutter.loader.loadEntrypoint({
              onEntrypointLoaded: function(engineInitializer) {
                engineInitializer.initializeEngine().then(function(appRunner) {
                  appRunner.runApp();
                });
              }
            });
          }
        } else {
          var mainScript = document.createElement('script');
          mainScript.src = 'main.dart.js';
          mainScript.type = 'application/javascript';
          document.body.appendChild(mainScript);
        }
      };
      script.onerror = function() {
        var mainScript = document.createElement('script');
        mainScript.src = 'main.dart.js';
        mainScript.type = 'application/javascript';
        document.body.appendChild(mainScript);
      };
      document.body.appendChild(script);
    }
  </script>
</body>
