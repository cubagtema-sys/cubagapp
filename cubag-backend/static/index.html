<!DOCTYPE html>
<html>
<head>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }
  </script>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CUBAG Enterprise Mobility Platform">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CUBAG">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="logo.jpeg"/>

  <title>CUBAG</title>
  <!-- Preconnect and preload Google Fonts Inter & Outfit to eliminate initial load font flashing -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=block" rel="stylesheet">

  <style>
    html, body {
      font-family: 'Inter', 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #1A0F0A;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: text;
      -webkit-user-select: text;
    }
    flt-glass-pane {
      user-select: text !important;
      -webkit-user-select: text !important;
    }
    #cubag-splash-loader {
      position: fixed;
      inset: 0;
      background-color: #1A0F0A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      transition: opacity 0.35s ease;
    }
    .splash-logo {
      width: 90px;
      height: 90px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      animation: cubagPulse 2s infinite ease-in-out;
    }
    @keyframes cubagPulse {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.04); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="cubag-splash-loader">
    <img class="splash-logo" src="logo.jpeg" alt="CUBAG Logo">
  </div>
  <!-- Flutter Web Bootstrap Loader -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var loader = document.getElementById('cubag-splash-loader');
      if (loader) {
        loader.style.opacity = '0';
        loader.style.pointerEvents = 'none';
        setTimeout(function() {
          if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
        }, 350);
      }
    });
  </script>
  <script>
    function loadFlutterFallback() {
      console.warn('flutter_bootstrap.js not found or failed, initializing Flutter fallback loader...');
      var script = document.createElement('script');
      script.src = 'flutter.js';
      script.onload = function() {
        if (window._flutter && window._flutter.loader) {
          if (typeof window._flutter.loader.load === 'function') {
            window._flutter.loader.load();
          } else if (typeof window._flutter.loader.loadEntrypoint === 'function') {
            window._flutter.loader.loadEntrypoint({
              onEntrypointLoaded: function(engineInitializer) {
                engineInitializer.initializeEngine().then(function(appRunner) {
                  appRunner.runApp();
                });
              }
            });
          }
        } else {
          var mainScript = document.createElement('script');
          mainScript.src = 'main.dart.js';
          mainScript.type = 'application/javascript';
          document.body.appendChild(mainScript);
        }
      };
      script.onerror = function() {
        var mainScript = document.createElement('script');
        mainScript.src = 'main.dart.js';
        mainScript.type = 'application/javascript';
        document.body.appendChild(mainScript);
      };
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
