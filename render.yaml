services:
  # 1. Flask Backend Web Service
  - type: web
    name: cubag-api-server
    env: python
    region: frankfurt
    plan: free
    buildCommand: "cd cubag-backend && pip install -r requirements.txt"
    startCommand: "gunicorn --chdir cubag-backend -w 1 --threads 8 -b 0.0.0.0:$PORT server:app"
    envVars:
      - key: FLASK_ENV
        value: "production"
      - key: FLASK_APP
        value: "server.py"
      # ── SECRETS: set these manually in the Render dashboard ──────────────
      # These were previously committed in plaintext and are now in git history.
      # ROTATE every one of them (they must be considered compromised), then add
      # the new values via Render > cubag-api-server > Environment. `sync: false`
      # keeps Render from overwriting the dashboard value on blueprint sync.
      - key: SECRET_KEY
        sync: false # ROTATE: generate a new random 64-hex key
      - key: DATABASE_URL
        sync: false # ROTATE: Supabase DB password (full postgresql:// URL)
      - key: JWT_SECRET_KEY
        sync: false # ROTATE: generate a new random 64-hex key
      - key: JWT_ACCESS_TOKEN_EXPIRES
        value: "604800"
      - key: CORS_ALLOWED_ORIGINS
        value: "*" # TODO: replace with your real web/mobile origins (comma-separated)
      - key: SMTP_HOST
        value: "smtp.hostinger.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: "support@winningedgeinvestment.com"
      - key: SMTP_PASS
        sync: false # ROTATE: Hostinger SMTP password
      - key: WHITSUNPAY_BASE_URL
        value: "https://developer.whitsun.dev"
      - key: WHITSUNPAY_CLIENT_ID
        sync: false # ROTATE: WhitsunPay client id
      - key: x-client-id
        sync: false # ROTATE: same value as WHITSUNPAY_CLIENT_ID
      - key: WHITSUNPAY_API_KEY
        sync: false # ROTATE: WhitsunPay LIVE API key (wp_live_...)
      - key: x-api-key
        sync: false # ROTATE: same value as WHITSUNPAY_API_KEY
      - key: WHITSUNPAY_WEBHOOK_SECRET
        sync: false # ROTATE: WhitsunPay webhook HMAC secret
      - key: WHITSUNPAY_CALLBACK_URL
        value: "https://cubag-api-server.onrender.com/api/payments/webhook"
      - key: x-callback-url
        value: "https://cubag-api-server.onrender.com/api/payments/webhook"
      - key: SUPABASE_URL
        value: "https://feanlatdsyhlghsnepxw.supabase.co"
      - key: SUPABASE_SERVICE_KEY
        sync: false # ROTATE: Supabase service-role JWT
      - key: SUPABASE_BUCKET
        value: "uploads"
      - key: RESEND_API_KEY
        sync: false # Set manually in Render dashboard (blocked by GitHub secret scanning)
      - key: AIS_API_KEY
        sync: false # ROTATE: AIS API key
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false # GITHUB BLOCKED THIS SECRET FROM BEING UPLOADED FOR YOUR SAFETY! Please paste it manually in Render.

  # 2. Flutter Web Frontend Static Site
  - type: web
    env: static
    name: cubag-web-app
    buildCommand: "cd cubag_flutter && git clone https://github.com/flutter/flutter.git -b stable && export PATH=\"$PATH:$(pwd)/flutter/bin\" && flutter build web --release --dart-define=PRODUCTION_API_URL=https://cubag-api-server.onrender.com/api/v1"
    staticPublishPath: cubag_flutter/build/web
    routes:
      # Redirect all 404s to index.html for Flutter Web's routing to work
      - type: rewrite
        source: /*
        destination: /index.html
