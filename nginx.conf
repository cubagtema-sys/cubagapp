# ── CUBAG Flutter Web — Production Nginx Config ─────────────────────────────
# Place this file at: /etc/nginx/sites-available/cubag
# Then: sudo ln -s /etc/nginx/sites-available/cubag /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx
#
# Assumes your Flutter build/web folder is at: /var/www/cubag/web
# Change server_name to your actual domain.

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # Redirect all HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    root /var/www/cubag/web;
    index index.html;

    # ── SSL (replace with your cert paths) ─────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    # ── Gzip Compression ───────────────────────────────────────────────────
    # Turns 4.3MB main.dart.js → ~1.1MB on the wire. Biggest single win.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/wasm
        font/woff2
        image/svg+xml
        text/css
        text/html
        text/plain;

    # ── Static Asset Caching ───────────────────────────────────────────────
    # Deferred JS chunks and other assets get long-lived cache headers.
    # Flutter appends content hashes to filenames so this is safe.
    location ~* \.(js|css|woff2|png|jpg|jpeg|svg|ico|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
    }

    # Flutter service worker — must NOT be cached so updates deploy instantly.
    location = /flutter_service_worker.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /manifest.json {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # ── SPA Routing ────────────────────────────────────────────────────────
    # All routes return index.html so Flutter's GoRouter handles navigation.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";  # index.html never cached
    }

    # ── Security Headers ───────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # ── Block common attack paths ──────────────────────────────────────────
    location ~ /\. { deny all; }
    location = /robots.txt { return 200 "User-agent: *\nAllow: /\n"; }
}
