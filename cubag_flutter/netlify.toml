[build]
  publish = "build/web"
  command = "flutter build web --release --dart-define=PRODUCTION_API_URL=https://your-backend.com/api/v1"

[build.environment]
  FLUTTER_VERSION = "3.44.8"

# ── SPA routing — all routes serve index.html ─────────────────────────────
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Cache: service worker never cached (so deploys work immediately) ───────
[[headers]]
  for = "/flutter_service_worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# ── Cache: JS chunks cached 1 year (safe — Flutter adds content hash) ──────
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Security headers ───────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
